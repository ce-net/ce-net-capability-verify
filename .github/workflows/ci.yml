name: ci
on: [push, pull_request]
jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: standard library only
        run: python3 test_vectors.py
      - run: pip install -r requirements.txt
      - run: python3 test_vectors.py
      - name: CLI smoke
        run: |
          ROOT=8a88e3dd7409f195fd52db2d3cba5d72ca6709bf1d94121bf3748801b40f6f5c
          TOKEN=$(python3 -c "import json; print(json.load(open('vectors.json'))['chains'][1]['chain_hex'])")
          python3 verify.py $ROOT $TOKEN 1700000100 | grep -q '^VALID'
          if python3 verify.py $ROOT $TOKEN 1700003601; then exit 1; fi
          python3 verify.py use vectors_v3_read_receipt.json
